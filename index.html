<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSY NETFLIX - 지금 상영 중인 영화</title>
  <meta name="description" content="현재 극장에서 상영 중인 최신 영화를 PSY NETFLIX에서 확인하세요.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 헤더 -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <div class="logo" id="logo">
        <span class="logo-psy">PSY</span><span class="logo-netflix">FLIX</span>
      </div>
      <nav class="header-nav">
        <a href="#" class="nav-link active">홈</a>
        <a href="#" class="nav-link">시리즈</a>
        <a href="#" class="nav-link">영화</a>
        <a href="#" class="nav-link">NEW! 요즘 대세</a>
        <a href="#" class="nav-link">내가 찜한 콘텐츠</a>
      </nav>
      <div class="header-right">
        <button class="header-icon-btn" id="searchBtn" aria-label="검색">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <div class="avatar-wrap">
          <div class="avatar">P</div>
        </div>
      </div>
    </div>
  </header>

  <!-- 히어로 배너 -->
  <section class="hero-section" id="heroSection">
    <div class="hero-skeleton" id="heroSkeleton">
      <div class="skeleton-block skeleton-title"></div>
      <div class="skeleton-block skeleton-desc"></div>
      <div class="skeleton-block skeleton-desc short"></div>
      <div class="skeleton-buttons">
        <div class="skeleton-block skeleton-btn"></div>
        <div class="skeleton-block skeleton-btn"></div>
      </div>
    </div>
    <div class="hero-content" id="heroContent" style="display:none;">
      <div class="hero-backdrop" id="heroBackdrop"></div>
      <div class="hero-gradient"></div>
      <div class="hero-info">
        <div class="hero-badge" id="heroBadge">🎬 현재 상영 중</div>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-overview" id="heroOverview"></p>
        <div class="hero-meta" id="heroMeta"></div>
        <div class="hero-buttons">
          <button class="hero-btn btn-play" id="heroPlayBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            재생
          </button>
          <button class="hero-btn btn-info" id="heroInfoBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            상세 정보
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 영화 그리드 섹션 -->
  <main class="main-content">

    <!-- 현재 상영 중 섹션 -->
    <section class="movies-section" id="nowPlayingSection">
      <div class="section-header">
        <h2 class="section-title">
          <span class="title-bar"></span>
          지금 극장에서 🔥
        </h2>
        <div class="section-nav">
          <button class="section-nav-btn" id="btnScrollLeft" aria-label="이전">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <button class="section-nav-btn" id="btnScrollRight" aria-label="다음">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 스켈레톤 로딩 -->
      <div class="movies-row" id="skeletonRow">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- 실제 영화 카드 -->
      <div class="movies-row hidden" id="moviesRow"></div>
    </section>

    <!-- 인기 순위 TOP 10 섹션 -->
    <section class="movies-section" id="top10Section" style="display:none;">
      <div class="section-header">
        <h2 class="section-title">
          <span class="title-bar"></span>
          오늘의 TOP 10 🏆
        </h2>
      </div>
      <div class="top10-grid" id="top10Grid"></div>
    </section>

  </main>

  <!-- 에러 메시지 -->
  <div class="error-wrap hidden" id="errorWrap">
    <div class="error-box">
      <div class="error-icon">⚠️</div>
      <h3>영화를 불러오지 못했습니다</h3>
      <p id="errorMsg">잠시 후 다시 시도해주세요.</p>
      <button class="retry-btn" id="retryBtn">다시 시도</button>
    </div>
  </div>

  <!-- 영화 상세 모달 -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose" aria-label="닫기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-gradient"></div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-logo"><span class="logo-psy">PSY</span><span class="logo-netflix">FLIX</span></p>
      <p class="footer-copy">영화 데이터 제공: <a href="https://www.themoviedb.org" target="_blank" rel="noopener">The Movie Database (TMDB)</a></p>
      <p class="footer-copy">© 2026 PSYFLIX. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
